# Promtail en Ubuntu 24.04: envía journald + syslog a Loki central
- hosts: linux
  become: true
  vars:
    loki_host: "{{ loki_ip | default('10.0.0.10') }}"
  tasks:
    - name: Crear usuario promtail
      user: {name: promtail, system: true, shell: /usr/sbin/nologin, create_home: false}
    - name: Agregar promtail a grupos de lectura de logs
      user: {name: promtail, groups: [systemd-journal, adm], append: true}
    - name: Descargar promtail 3.3.2
      unarchive: {src: https://github.com/grafana/loki/releases/download/v3.3.2/promtail-3.3.2-linux-amd64.tar.gz, dest: /opt, remote_src: true, creates: /opt/promtail-3.3.2-linux-amd64}
    - name: Instalar binario
      copy: {src: /opt/promtail-3.3.2-linux-amd64/promtail-linux-amd64, dest: /usr/local/bin/promtail, mode: '0755', remote_src: true}
    - name: Configuración promtail
      copy:
        dest: /etc/promtail-config.yml
        content: |
          server:
            http_listen_port: 9080
          positions:
            filename: /var/lib/promtail/positions.yaml
          clients:
            - url: http://{{ loki_host }}:3100/loki/api/v1/push
          scrape_configs:
            - job_name: journal
              journal:
                path: /var/log/journal
                labels: {job: systemd-journal, host: {{ inventory_hostname }}}
              relabel_configs:
                - source_labels: [__journal__systemd_unit]
                  target_label: unit
            - job_name: syslog
              static_configs:
                - targets: [localhost]
                  labels: {job: syslog, host: {{ inventory_hostname }}, __path__: /var/log/syslog}
    - name: Directorio posiciones
      file: {path: /var/lib/promtail, state: directory, owner: promtail, group: promtail, mode: '0755'}
    - name: Servicio promtail
      copy:
        dest: /etc/systemd/system/promtail.service
        content: |
          [Unit]
          Description=Promtail log shipper
          [Service]
          User=promtail
          ExecStart=/usr/local/bin/promtail -config.file=/etc/promtail-config.yml
          Restart=always
          [Install]
          WantedBy=multi-user.target
    - name: Habilitar promtail
      systemd: {name: promtail, enabled: true, state: restarted, daemon_reload: true}
