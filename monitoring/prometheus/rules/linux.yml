groups:
  - name: linux
    interval: 30s
    rules:
      - alert: LinuxDown
        expr: up{job="node"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Node Exporter sin responder en {{$labels.instance}}"}
      - alert: CpuHigh
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "CPU > 90% 5m en {{$labels.instance}}"}
      - alert: CpuWarn
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 75
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "CPU > 75% 5m en {{$labels.instance}}"}
      - alert: RamHigh
        expr: 100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 90
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "RAM > 90% en {{$labels.instance}}"}
      - alert: DiskWarn
        expr: 100 * (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes)) > 85
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Disco > 85% en {{$labels.instance}} {{$labels.mountpoint}}"}
      - alert: DiskCrit
        expr: 100 * (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes)) > 95
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Disco > 95% en {{$labels.instance}} {{$labels.mountpoint}}"}
      - alert: ServiceDown
        expr: node_systemd_unit_state{name=~".*\\.(ssh|nginx|apache2|docker|postgresql|mysql|mariadb).*", state="active"} == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Servicio critico detenido {{$labels.name}} en {{$labels.instance}}"}
